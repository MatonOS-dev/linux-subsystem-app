plugins { id 'com.android.application' }

dependencies {
    implementation files('../../../stubgen/prebuilt/apksig.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// A PIE executable named as a JNI library so updates extract it with executable
// permissions. The image extracts its copy from this same APK (buildinfra).
def brokerRoot = file('../../../dbus-broker')
def brokerOutput = System.getenv('MATON_DBUS_ANDROID_OUT') ?: layout.buildDirectory.dir('broker/android').get().asFile.absolutePath
def aospRoot = System.getenv('MATON_BUILD_ROOT') ?: file('../../../../out').absolutePath
def brokerJni = new File(layout.buildDirectory.get().asFile, 'generated/brokerJni')
def buildSessionBroker = tasks.register('buildSessionBroker', Exec) {
    inputs.dir brokerRoot
    outputs.dir brokerOutput
    // build-android.sh also tracks the external static dependency builds.
    outputs.upToDateWhen { false }
    environment 'MATON_DBUS_ANDROID_OUT', brokerOutput
    environment 'MATON_AOSP_ROOT', aospRoot
    if (System.getenv('MATON_NDK')) environment 'MATON_ANDROID_NDK', System.getenv('MATON_NDK')
    commandLine 'bash', new File(brokerRoot, 'build-android.sh').absolutePath
}
def packageSessionBroker = tasks.register('packageSessionBroker', Copy) {
    dependsOn buildSessionBroker
    from(new File(brokerOutput, 'libmatonos-dbus-broker.so'))
    into new File(brokerJni, 'x86_64')
}
tasks.named('preBuild').configure { dependsOn packageSessionBroker }

def planRoot = file('../../flatpak-plan')
def planOutput = System.getenv('MATON_FLATPAK_PLAN_OUT') ?: "$aospRoot/out/matonos/flatpak-plan"
def planJni = new File(layout.buildDirectory.get().asFile, 'generated/planJni')
def buildFlatpakPlan = tasks.register('buildFlatpakPlan', Exec) {
    outputs.upToDateWhen { false }
    inputs.files fileTree(planRoot)
    outputs.file new File(planOutput, 'libmatonos-flatpak-plan.so')
    environment 'MATON_AOSP_ROOT', aospRoot
    commandLine 'python3', new File(planRoot, 'build.py').absolutePath, planOutput
}
def packageFlatpakPlan = tasks.register('packageFlatpakPlan', Copy) {
    dependsOn buildFlatpakPlan
    from new File(planOutput, 'libmatonos-flatpak-plan.so')
    into new File(planJni, 'x86_64')
}
tasks.named('preBuild').configure { dependsOn packageFlatpakPlan }

def vulkanOutput = System.getenv('MATON_VULKAN_OUT') ?: "$aospRoot/out/matonos/vulkan-forward"
def vulkanHeaders = System.getenv('MATON_VULKAN_HEADERS') ?: "$vulkanOutput/src/Vulkan-Headers-1.4.341"
def vulkanJni = new File(layout.buildDirectory.get().asFile, 'generated/vulkanJni/x86_64')
def vulkanAssets = new File(layout.buildDirectory.get().asFile, 'generated/vulkanAssets')
def buildVulkanForward = tasks.register('buildVulkanForward', Exec) {
    inputs.files fileTree('../../../vulkan-forward') { exclude 'build/**' }
    outputs.files new File(vulkanOutput, 'libmaton_vulkan.so'), new File(vulkanOutput, 'maton_icd.json')
    outputs.upToDateWhen { false }
    environment 'CMAKE', System.getenv('CMAKE') ?: '/mnt/data/aosp/prebuilts/cmake/linux-x86/bin/cmake'
    commandLine 'bash', file('../../../vulkan-forward/build.sh').absolutePath, vulkanOutput, vulkanHeaders
}
def packageVulkanForward = tasks.register('packageVulkanForward', Copy) {
    dependsOn buildVulkanForward
    from(new File(vulkanOutput, 'libmaton_vulkan.so')) { into 'vulkanJni/x86_64' }
    from(new File(vulkanOutput, 'maton_icd.json')) { into 'vulkanAssets/vulkan' }
    into layout.buildDirectory.dir('generated')
    doLast {
        def manifest = new File(vulkanAssets, 'vulkan/maton_icd.json')
        def json = manifest.getText('UTF-8')
        def buildPath = new File(vulkanOutput, 'libmaton_vulkan.so').absolutePath
        def source = '"library_path": "' + buildPath + '"'
        def target = '"library_path": "/run/maton/vulkan/libmaton_vulkan.so"'
        if (!json.contains(source)) throw new GradleException('Vulkan ICD build path was not present in its manifest')
        manifest.setText(json.replace(source, target), 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn packageVulkanForward }

def eglRoot = file('../../../egl-forward')
def eglOutput = System.getenv('MATON_EGL_OUT') ?: "$aospRoot/out/matonos/egl-forward"
def eglDeps = new File(eglOutput, 'deps')
def eglNdk = System.getenv('MATON_NDK') ?: "${System.getProperty('user.home')}/Android/Sdk/ndk/30.0.16248370"
def buildEglForward = tasks.register('buildEglForward', Exec) {
    inputs.files fileTree(eglRoot)
    outputs.files new File(eglOutput, 'libEGL_maton.so'), new File(eglOutput, '10_maton.json')
    outputs.upToDateWhen { false }
    environment 'CC', System.getenv('MATON_EGL_CC') ?: 'clang-21'
    environment 'READELF', System.getenv('MATON_EGL_READELF') ?: 'llvm-readelf-21'
    commandLine 'bash', '-c', 'set -euo pipefail; bash "$1/fetch-tools.sh" "$2"; CC="$3" READELF="$4" bash "$1/build.sh" "$5" "$2" "$6"',
            'egl-forward-build', eglRoot.absolutePath, eglDeps.absolutePath,
            System.getenv('MATON_EGL_CC') ?: 'clang-21',
            System.getenv('MATON_EGL_READELF') ?: 'llvm-readelf-21', eglOutput, eglNdk
}
def eglJni = new File(layout.buildDirectory.get().asFile, 'generated/eglJni/x86_64')
def eglAssets = new File(layout.buildDirectory.get().asFile, 'generated/eglAssets/egl')
def packageEglForward = tasks.register('packageEglForward', Copy) {
    dependsOn buildEglForward
    from(new File(eglOutput, 'libEGL_maton.so')) { into 'eglJni/x86_64' }
    from(new File(eglOutput, '10_maton.json')) { into 'eglAssets/egl' }
    into layout.buildDirectory.dir('generated')
    doLast {
        def manifest = new File(eglAssets, '10_maton.json')
        def json = manifest.getText('UTF-8')
        def target = '"library_path": "/run/maton/egl/libEGL_maton.so"'
        if (!json.contains(target)) throw new GradleException('EGL vendor manifest does not point at /run/maton/egl')
    }
}
tasks.named('preBuild').configure { dependsOn packageEglForward }

def v3Root = file('../../../compat-proxy')
def v3Output = System.getenv('MATON_V3_ANDROID_OUT') ?: "$aospRoot/out/matonos/compat-proxy"
def v3Jni = new File(layout.buildDirectory.get().asFile, 'generated/v3Jni')
def buildV3Loader = tasks.register('buildV3Loader', Exec) {
    // Sources only: build/ holds host test scaffolds (device nodes, symlinks).
    inputs.files fileTree(v3Root) { exclude "build/**", "__pycache__/**" }
    outputs.file new File(v3Output, 'libmatonos-v3-loader.so')
    outputs.file new File(v3Output, 'libmatonos-v3-loader-i386.so')
    outputs.upToDateWhen { false }
    environment 'MATON_AOSP_ROOT', aospRoot
    environment 'MATON_V3_ANDROID_OUT', v3Output
    if (System.getenv('MATON_NDK')) environment 'MATON_ANDROID_NDK', System.getenv('MATON_NDK')
    commandLine 'bash', new File(v3Root, 'build-android.sh').absolutePath
}
def packageV3Loader = tasks.register('packageV3Loader', Copy) {
    dependsOn buildV3Loader
    from fileTree(v3Output) { include 'libmatonos*.so' }
    into new File(v3Jni, 'x86_64')
}
tasks.named('preBuild').configure { dependsOn packageV3Loader }

// Executable Flatpak entry points travel in the subsystem APK's native
// library directory so host updates update the tools and v3 loader together.
def flatpakJni = new File(layout.buildDirectory.get().asFile, 'generated/flatpakJni/x86_64')
def flatpakTools = file('../../../flatpak/prebuilt/static/x86_64')
def buildFlatpakHelpers = tasks.register('buildFlatpakHelpers', Exec) {
    inputs.files file('../../../flatpak/matonos-app-tool.c'), file('../../../../tools/build-flatpak-helpers.sh')
    outputs.files new File(flatpakTools, 'matonos-app-flatpak'), new File(flatpakTools, 'matonos-app-bwrap')
    commandLine 'bash', file('../../../../tools/build-flatpak-helpers.sh').absolutePath
}
def packageFlatpakTools = tasks.register('packageFlatpakTools', Copy) {
    dependsOn buildFlatpakHelpers
    from(file('../../../flatpak/prebuilt/static/x86_64/matonos-flatpak')) { rename { 'libmatonos-flatpak.so' } }
    from(file('../../../flatpak/prebuilt/static/x86_64/matonos-app-flatpak')) { rename { 'libmatonos-app-flatpak.so' } }
    from(file('../../../flatpak/prebuilt/static/x86_64/matonos-app-bwrap')) { rename { 'libmatonos-app-bwrap.so' } }
    into flatpakJni
}
tasks.named('preBuild').configure { dependsOn packageFlatpakTools }
def flatpakAssets = new File(layout.buildDirectory.get().asFile, 'generated/flatpakAssets')
def packageFlatpakRemote = tasks.register('packageFlatpakRemote', Copy) {
    from file('../../../flatpak/etc/flatpak/remotes.d/flathub.flatpakrepo')
    into new File(flatpakAssets, 'flatpak/remotes.d')
}
tasks.named('preBuild').configure { dependsOn packageFlatpakRemote }

def pipewireRoot = file('../../../pipewire')
def pipewireOutput = System.getenv('MATON_PIPEWIRE_BUILD') ?: "$aospRoot/out/matonos/pipewire"
def buildPipeWire = tasks.register('buildPipeWire', Exec) {
    inputs.dir pipewireRoot
    outputs.dir new File(pipewireOutput, 'jniLibs')
    environment 'MATON_AOSP_ROOT', aospRoot
    environment 'MATON_PIPEWIRE_BUILD', pipewireOutput
    commandLine 'bash', new File(pipewireRoot, 'build-android.sh').absolutePath
}
def pipewireAssets = layout.buildDirectory.dir('generated/pipewireAssets').get().asFile
def packagePipeWireNotices = tasks.register('packagePipeWireNotices', Copy) {
    dependsOn buildPipeWire
    from new File(pipewireOutput, 'COPYING'), new File(pipewireOutput, 'SOURCE')
    into new File(pipewireAssets, 'pipewire')
}
tasks.named('preBuild').configure { dependsOn packagePipeWireNotices }

def xwaylandOutput = new File(layout.buildDirectory.get().asFile, 'generated/xwayland')
def packageXwayland = tasks.register('packageXwayland', Exec) {
    outputs.upToDateWhen { false }
    commandLine 'python3', file('../../../../tools/package-xwayland.py').absolutePath, xwaylandOutput.absolutePath
}
tasks.named('preBuild').configure { dependsOn packageXwayland }

android {
    namespace 'org.matonos.linux'
    compileSdk 36
    defaultConfig {
        applicationId 'org.matonos.linux'; minSdk 36; targetSdk 36; versionCode 1; versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'x86_64' }
        externalNativeBuild { cmake { arguments '-DMATON_COMPOSITOR_ROOT=' + projectDir.absolutePath + '/../..', '-DMATON_AOSP_ROOT=' + aospRoot, '-DMATON_COMPOSITOR_BUILD=' + (System.getenv('MATON_COMPOSITOR_BUILD') ?: "$aospRoot/out/matonos/compositor"), '-DMATON_PIPEWIRE_BUILD=' + pipewireOutput } }
    }
    buildFeatures { aidl true }
    packaging {
        jniLibs {
            // Keep extractNativeLibs=true for the broker in adb-installed updates.
            // build-apps.sh stores/page-aligns JNI before signing the staged APK
            // so the preinstalled copy can also load JNI directly from the ZIP.
            useLegacyPackaging = true
            // Preserve the executable ELF, rather than treating it as a DSO.
            keepDebugSymbols += '**/libmatonos-Xwayland*.so'
            keepDebugSymbols += '**/libmatonos-xkbcomp.so'
            keepDebugSymbols += '**/libmatonos-dbus-broker.so'
            keepDebugSymbols += '**/libmatonos-flatpak-plan.so'
            keepDebugSymbols += '**/libmatonos-v3-loader.so'
            keepDebugSymbols += '**/libmatonos-v3-loader-i386.so'
            keepDebugSymbols += '**/libmatonos-flatpak.so'
            keepDebugSymbols += '**/libmatonos-app-flatpak.so'
            keepDebugSymbols += '**/libmatonos-app-bwrap.so'
            keepDebugSymbols += '**/libmaton_vulkan.so'
            keepDebugSymbols += '**/libEGL_maton.so'
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('MATON_SIGNING_STORE_FILE'))
            storePassword System.getenv('MATON_SIGNING_STORE_PASSWORD')
            keyAlias System.getenv('MATON_SIGNING_KEY_ALIAS')
            keyPassword System.getenv('MATON_SIGNING_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    externalNativeBuild { cmake {
        path '../../native/CMakeLists.txt'
        if (System.getenv('MATON_SUBSYSTEM_OUT')) buildStagingDirectory file(System.getenv('MATON_SUBSYSTEM_OUT') + '/cxx')
    } }
    ndkVersion '30.0.16248370'
    ndkPath System.getenv('MATON_NDK') ?: "${System.getProperty('user.home')}/Documents/android-ndk-r30"
    sourceSets {
        main {
            java.srcDirs += file('../../../stubgen/src')
            def compositorJni = System.getenv('MATON_COMPOSITOR_JNI_LIBS')
            if (!compositorJni) throw new GradleException('MATON_COMPOSITOR_JNI_LIBS is not set (build through ./build.sh)')
            jniLibs.srcDirs += file(compositorJni)
            jniLibs.srcDir new File(xwaylandOutput, 'jni')
            assets.srcDir new File(xwaylandOutput, 'assets')
            jniLibs.srcDir brokerJni
            jniLibs.srcDir v3Jni
            jniLibs.srcDir planJni
            jniLibs.srcDir new File(layout.buildDirectory.get().asFile, 'generated/vulkanJni')
            jniLibs.srcDir new File(layout.buildDirectory.get().asFile, 'generated/flatpakJni')
            jniLibs.srcDir new File(pipewireOutput, 'jniLibs')
            assets.srcDir pipewireAssets
            assets.srcDir flatpakAssets
            assets.srcDir vulkanAssets
            jniLibs.srcDir new File(layout.buildDirectory.get().asFile, 'generated/eglJni')
            assets.srcDir new File(layout.buildDirectory.get().asFile, 'generated/eglAssets')
        }
    }
}
